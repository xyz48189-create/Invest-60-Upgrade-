<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f9;--card:#fff;--ink:#0f2347;--mut:#6a7690;--acc:#f26a21;--acc2:#f26a21;--ok:#12a36b;--bad:#e5484d;--line:#e4e8f0;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1630;--card:#13213f;--ink:#eef2fb;--mut:#92a0bf;--acc:#ff7a33;--acc2:#ff7a33;--ok:#2fd195;--bad:#ff6b70;--line:#223457;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1630;--card:#13213f;--ink:#eef2fb;--mut:#92a0bf;--acc:#ff7a33;--acc2:#ff7a33;--ok:#2fd195;--bad:#ff6b70;--line:#223457;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px}
h1{font:700 26px/1.2 "Segoe UI",system-ui,sans-serif;margin:4px 0}
h2{font:700 17px "Segoe UI",system-ui,sans-serif;margin:22px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(15,35,71,.06)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f26a21,#ff9a4d);width:0;transition:width .4s}
button,input,select{font:inherit;color:inherit}
button{background:var(--acc2);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--acc2);border:1px solid var(--acc2)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.topic{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.topic.done span.t{text-decoration:line-through;color:var(--mut)}
.topic .d{min-width:30px;color:var(--mut);font-size:13px}
.topic input{width:22px;height:22px;accent-color:var(--ok)}
.today{border:2px solid var(--acc)}
a.v{display:inline-block;margin:4px 6px 4px 0;padding:8px 12px;border:1px solid var(--line);border-radius:20px;color:var(--acc2);text-decoration:none;font-size:14px}
.q{margin:8px 0;padding-left:4px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);margin:6px 0}
.opt.ok{border-color:var(--ok);background:rgba(31,138,91,.15)}
.opt.no{border-color:var(--bad);background:rgba(192,57,43,.15)}
#alarm{position:fixed;inset:0;background:rgba(10,12,30,.92);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9}
#alarm h1{font-size:34px}
.back{background:none;color:var(--acc2);padding:0;margin:6px 0}
.badge{display:inline-block;margin:6px 6px 0 0;padding:6px 10px;border-radius:20px;border:1px solid var(--acc);font-size:14px}.badge.off{opacity:.4;filter:grayscale(1);border-color:var(--line)}textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font:inherit;color:inherit;margin-top:8px}.brand{display:flex;align-items:center;gap:12px}.brand img{height:56px;width:auto}.brand h1{margin:0;font-size:30px;letter-spacing:.5px}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand img{filter:brightness(1.7) saturate(1.2)}}:root[data-theme="dark"] .brand img{filter:brightness(1.7) saturate(1.2)}.fld{display:block;width:100%;margin:4px 0 10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;color:inherit}.creator{font:700 clamp(20px,6vw,28px)/1.25 'Cinzel Decorative',Georgia,serif;text-align:center;margin:18px 0 6px;background:linear-gradient(90deg,#f26a21,#ff9a4d,#f26a21);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}details.card summary{cursor:pointer;font-weight:700;color:var(--acc);list-style:none;text-align:center;line-height:1.4}details.card summary::-webkit-details-marker{display:none}.about{margin-top:10px;white-space:pre-line}.contact a{color:var(--acc);font-weight:600}
#splash{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}#splash.out{opacity:0;pointer-events:none}#splash img{height:120px;width:auto;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}.sn{margin-top:14px;font:700 30px 'Cinzel Decorative',Georgia,serif;letter-spacing:2px;animation:rise .9s .5s both}.sl{margin-top:18px;width:120px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}.sl i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f26a21,#ff9a4d);animation:ld 1.6s .3s forwards}@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-8deg)}100%{opacity:1;transform:none}}@keyframes rise{0%{opacity:0;transform:translateY(14px);letter-spacing:8px}100%{opacity:1;transform:none;letter-spacing:2px}}@keyframes ld{to{width:100%}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #splash img{filter:brightness(1.7) saturate(1.2)}}:root[data-theme="dark"] #splash img{filter:brightness(1.7) saturate(1.2)}@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head>

<script>

function sip(){app.innerHTML=`<button class='back' onclick='home()'>‹ Home</button><h1>SIP calculator</h1><div class='card'>${[['m','Monthly SIP (₹)',5000],['y','Years',10],['r','Expected return (% per year)',12],['s','Yearly step-up (%)',0]].map(([i,l,v])=>`<label class='mut'>${l}<input id='${i}' type='number' inputmode='decimal' value='${v}' oninput='calc()' class='fld'></label>`).join('')}</div><div class='card' id='out'></div>`;calc()}
function calc(){const m=+$('#m').value||0,y=Math.min(+$('#y').value||0,60),r=(+$('#r').value||0)/1200,s=(+$('#s').value||0)/100;let v=0,inv=0,a=m;for(let k=1;k<=y*12;k++){v=(v+a)*(1+r);inv+=a;if(k%12===0)a*=1+s}const f=n=>'₹'+Math.round(n).toLocaleString('en-IN');$('#out').innerHTML=`<div class='mut'>Total invested</div><b>${f(inv)}</b><div class='mut' style='margin-top:8px'>Estimated value</div><div style='font-size:26px;font-weight:700;color:var(--acc)'>${f(v)}</div><div class='mut' style='margin-top:8px'>Estimated gain: ${f(v-inv)}</div><div class='mut' style='margin-top:8px'>This is only an estimate. Real returns change every year and are not guaranteed.</div>`}
function jr(){app.innerHTML=`<button class='back' onclick='home()'>‹ Home</button><h1>My journal</h1><div class='mut'>Write what you bought and why. Come back later and note the result.</div><div class='card'><b>New entry</b><input id='jw' class='fld' style='margin-top:8px' placeholder='What did you buy? (e.g. Nifty 50 index fund)'><input id='ja' class='fld' type='number' inputmode='decimal' placeholder='Amount (₹)'><textarea id='jy' placeholder='Why did you buy it?'></textarea><button style='margin-top:10px' onclick='jadd()'>Save entry</button></div><div id='jl'></div>`;jlist()}
function jadd(){const w=$('#jw').value.trim();if(!w)return;S.journal.unshift({w,a:$('#ja').value,y:$('#jy').value,d:new Date().toLocaleDateString('en-IN'),r:''});save();jr()}
function jlist(){$('#jl').innerHTML=S.journal.length?S.journal.map((e,i)=>`<div class='card'><b>${esc(e.w)}</b><div class='mut'>${e.d}${e.a?' · ₹'+esc(String(e.a)):''}</div><div style='margin:6px 0'>${esc(e.y||'')}</div><textarea style='min-height:60px' placeholder='Result / what I learned later' oninput='S.journal[${i}].r=this.value;save()'>${esc(e.r||'')}</textarea><button class='ghost' style='margin-top:8px' onclick='jdel(${i})'>Delete</button></div>`).join(''):`<div class='mut' style='margin-top:12px'>No entries yet. Write your first one above.</div>`}
function jdel(i){S.journal.splice(i,1);save();jlist()}
function gl(){app.innerHTML=`<button class='back' onclick='home()'>‹ Home</button><h1>Goal tracker</h1><div class='card'><b>New goal</b><input id='gn' class='fld' style='margin-top:8px' placeholder='Goal (e.g. Bike, Emergency fund)'><input id='gt' class='fld' type='number' inputmode='decimal' placeholder='Target amount (₹)'><input id='gs' class='fld' type='number' inputmode='decimal' placeholder='Saved so far (₹)'><input id='gy' class='fld' type='number' inputmode='decimal' placeholder='Years to reach it'><button onclick='gadd()'>Save goal</button></div><div id='gll'></div>`;glist()}
function gadd(){const n=$('#gn').value.trim(),t=+$('#gt').value;if(!n||!t)return;S.goals.unshift({n,t,s:+$('#gs').value||0,y:+$('#gy').value||0});save();gl()}
function glist(){const f=n=>'₹'+Math.round(n).toLocaleString('en-IN');$('#gll').innerHTML=S.goals.length?S.goals.map((g,i)=>{const p=Math.min(100,Math.round(g.s/g.t*100)),rem=Math.max(0,g.t-g.s);return `<div class='card'><b>${esc(g.n)}</b><div class='mut'>${f(g.s)} of ${f(g.t)} · ${p}%</div><div class='bar'><i style='width:${p}%'></i></div>${g.y&&rem?`<div class='mut'>Needs about ${f(rem/(g.y*12))} per month, without counting any returns.</div>`:''}<label class='mut'>Saved so far (₹)<input class='fld' type='number' inputmode='decimal' value='${g.s}' oninput='S.goals[${i}].s=+this.value||0;save()' onchange='glist()'></label><button class='ghost' onclick='gdel(${i})'>Delete</button></div>`}).join(''):`<div class='mut' style='margin-top:12px'>No goals yet. Add your first one above.</div>`}
function gdel(i){S.goals.splice(i,1);save();glist()}
const IC=['Read the DRHP/RHP summary','Understand how the company earns money','Checked promoter background','Use of IPO funds is clear','Valuation compared with peers','Profit and debt trend checked','Checked GMP (unofficial) and subscription data','Decided: listing gain or long-term'];
function ip(){app.innerHTML=`<button class='back' onclick='home()'>‹ Home</button><h1>IPO checklist</h1><div class='mut'>Tick every point before you apply. A learning aid, not advice.</div><div class='card'><b>New IPO</b><input id='in' class='fld' style='margin-top:8px' placeholder='IPO name'><button onclick='iadd()'>Add IPO</button></div><div id='il'></div>`;ilist()}
function iadd(){const n=$('#in').value.trim();if(!n)return;S.ipos.unshift({n,c:IC.map(()=>0)});save();ip()}
function ilist(){$('#il').innerHTML=S.ipos.length?S.ipos.map((o,i)=>{const k=o.c.filter(Boolean).length;return `<div class='card'><b>${esc(o.n)}</b><div class='mut'>${k} of ${IC.length} done</div><div class='bar'><i style='width:${k/IC.length*100}%'></i></div>${IC.map((t,j)=>`<label class='topic' style='cursor:pointer'><input type='checkbox' ${o.c[j]?'checked':''} onchange='itick(${i},${j},this.checked)'><span>${t}</span></label>`).join('')}<button class='ghost' style='margin-top:8px' onclick='idel(${i})'>Delete</button></div>`}).join(''):`<div class='mut' style='margin-top:12px'>No IPOs yet. Add one above.</div>`}
function itick(i,j,v){S.ipos[i].c[j]=v?1:0;save();ilist()}
function idel(i){S.ipos.splice(i,1);save();ilist()}
let ti=0,sc=0;
function test(){ti=0;sc=0;q()}
function q(){if(ti>=TEST.length){S.best=Math.max(S.best,sc);save();const pc=Math.round(sc/TEST.length*100);
app.innerHTML=`<h1>Test finished</h1><div class="card"><div style="font-size:34px">${sc} / ${TEST.length}</div><div class="mut">${pc>=80?"Strong. Now start a tiny real SIP and keep a journal.":pc>=50?"Good start. Revisit topics you missed.":"Revise the topics again; repetition works."}</div></div><div class="row"><button onclick="test()">Retake</button><button class="ghost" onclick="home()">Home</button></div>`;return}
const [x,o,a]=TEST[ti];
app.innerHTML=`<div class="mut">Question ${ti+1} of ${TEST.length}</div><div class="bar"><i style="width:${ti/TEST.length*100}%"></i></div><h2 style="font-size:20px">${x}</h2>`+o.map((t,j)=>`<button class="opt" onclick="ans(${j})">${t}</button>`).join("")}
function ans(j){const a=TEST[ti][2],b=document.querySelectorAll(".opt");b.forEach((e,k)=>{e.disabled=1;if(k===a)e.classList.add("ok");else if(k===j)e.classList.add("no")});if(j===a)sc++;ti++;setTimeout(q,1100)}
let ctx;function beep(){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();[0,.4,.8].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.3;o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.25)})}catch(e){}}
let loop;function ring(test){const k=cur();$("#atopic").textContent=k>=0?"Day "+(k+1)+": "+T[k].n:"Review your notes today";$("#alarm").style.display="flex";beep();clearInterval(loop);loop=setInterval(beep,2500);
if(!test&&window.Notification&&Notification.permission==="granted")try{new Notification("Time to learn!",{body:$("#atopic").textContent})}catch(e){}}
$("#stop").onclick=()=>{clearInterval(loop);$("#alarm").style.display="none"};
function setAlarm(){S.time=$("#tm").value;save();if(window.Notification&&Notification.permission==="default")Notification.requestPermission();$("#amsg").textContent="Reminder set for "+S.time+" daily (keep this page open)."}
setInterval(()=>{const d=new Date(),hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),key=d.toDateString();if(hm===S.time&&S.fired!==key){S.fired=key;save();ring()}},15000);
home();
const si=document.querySelector('.brand img'),sp=document.getElementById('spi');if(si)sp.src=si.src;setTimeout(()=>{const s=document.getElementById('splash');s.classList.add('out');setTimeout(()=>s.remove(),600)},2300);
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
